name: Deploy to GitHub Pages

# Builds the app and deploys it to GitHub Pages. The site hosts only the free
# rules committed under public/data; no book data is fetched or published here.
#
# NOTE: deployment only works once Pages is enabled for the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until then the build steps still run, but the deploy step will not publish.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gate as a local `pnpm validate`: lint, types, formatting, and the
      # tests with their coverage thresholds.
      - name: Validate
        run: pnpm validate

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
