<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your sign-in code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f3f4f6">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f3f4f6"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 480px;
              background-color: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 8px;
            "
          >
            <tr>
              <td
                style="
                  padding: 32px 32px 8px 32px;
                  font-family: Arial, Helvetica, sans-serif;
                  color: #111827;
                "
              >
                <h1
                  style="
                    margin: 0 0 12px 0;
                    font-size: 22px;
                    line-height: 28px;
                    font-weight: bold;
                    color: #111827;
                  "
                >
                  Your sign-in code
                </h1>
                <p
                  style="
                    margin: 0 0 20px 0;
                    font-size: 15px;
                    line-height: 22px;
                    color: #374151;
                  "
                >
                  Enter this code on the sign-in page. It expires in 1 hour.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 24px 32px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        background-color: #f3f4f6;
                        border: 1px solid #e5e7eb;
                        border-radius: 8px;
                        padding: 18px 8px;
                        font-family: 'Courier New', Courier, monospace;
                        font-size: 34px;
                        line-height: 40px;
                        font-weight: bold;
                        letter-spacing: 10px;
                        color: #111827;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  padding: 0 32px 8px 32px;
                  font-family: Arial, Helvetica, sans-serif;
                "
              >
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      align="center"
                      bgcolor="#38619d"
                      style="background-color: #38619d; border-radius: 6px"
                    >
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="
                          display: inline-block;
                          padding: 12px 28px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 16px;
                          line-height: 20px;
                          font-weight: bold;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 6px;
                        "
                        >Sign in on this device</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  padding: 8px 32px 24px 32px;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 13px;
                  line-height: 20px;
                  color: #6b7280;
                "
              >
                If the button does not work, paste this link into your browser:<br />
                <a
                  href="{{ .ConfirmationURL }}"
                  style="color: #38619d; word-break: break-all"
                  >{{ .ConfirmationURL }}</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 32px 32px 32px;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 13px;
                  line-height: 20px;
                  color: #6b7280;
                  border-top: 1px solid #e5e7eb;
                "
              >
                <p style="margin: 20px 0 0 0">
                  If you did not ask to sign in, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 100%; max-width: 480px"
          >
            <tr>
              <td
                align="center"
                style="
                  padding: 16px 32px;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 12px;
                  line-height: 18px;
                  color: #9ca3af;
                "
              >
                D&amp;D 5e Character Creator
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
